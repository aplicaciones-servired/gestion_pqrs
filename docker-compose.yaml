version: '3.7'

services:
  FrontEndPqrs:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: frontendpqrs:v1
    container_name: frontendpqrs_v1.0
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ServerPqrs
    networks:
      - red-gane-int

  ServerPqrs:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: serverpqrs_v1.0
    image: serverpqrs:v1
    networks:
      - red-gane-int
    environment:
      - TZ=America/Bogota

networks:
  red-gane-int:
    external: true
    
